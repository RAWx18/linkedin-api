name: Deploy

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Azure resource group name
        required: true
      location:
        description: Azure region
        required: false
        default: eastus

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Ensure resource group
        run: az group create --name "${{ github.event.inputs.resourceGroup }}" --location "${{ github.event.inputs.location }}"

      - name: Provision infrastructure
        id: infra
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ github.event.inputs.resourceGroup }}
          template: deploy/bicep/main.bicep
          parameters: >-
            linkedInLiAt=${{ secrets.LINKEDIN_LI_AT }}
            linkedInJSessionID=${{ secrets.LINKEDIN_JSESSIONID }}
            linkedInUserAgent=${{ secrets.LINKEDIN_USER_AGENT }}
            apiKeys=${{ secrets.API_KEYS }}

      - name: Build and push image
        env:
          ACR_NAME: ${{ steps.infra.outputs.acrName }}
          ACR_SERVER: ${{ steps.infra.outputs.acrLoginServer }}
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_SERVER/linkedin-api:${{ github.sha }}"
          docker build -f deploy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll out new image
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.appName }}" \
            --resource-group "${{ github.event.inputs.resourceGroup }}" \
            --image "$IMAGE"

      - name: Output public URL
        run: echo "Deployed to ${{ steps.infra.outputs.appUrl }}"
