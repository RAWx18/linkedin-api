openapi: 3.0.3
info:
  title: linkedin-api
  description: >
    Retrieves publicly accessible LinkedIn profile information via LinkedIn's
    internal profile API and returns it as a normalized JSON document.
  version: "2.0"
servers:
  - url: https://your-app.azurecontainerapps.io
    description: Production (replace with the deployed URL)
  - url: http://localhost:8080
    description: Local development

paths:
  /v1/profile:
    get:
      summary: Fetch a normalized LinkedIn profile
      operationId: getProfile
      description: >
        Returns a normalized profile. Access is authorized by the X-API-Key header
        when API_KEYS is configured; the co-hosted same-origin browser UI is exempt
        so the server key never reaches the browser, while programmatic clients must
        send it. By default the request uses the server-configured LinkedIn session.
        A caller may optionally supply its own LinkedIn session through the
        X-LinkedIn-Li-At and X-LinkedIn-JSESSIONID headers, with optional
        X-LinkedIn-User-Agent; when both cookies are present the request uses only
        that caller session, never the server session, and is not served from or
        written to the shared cache. Caller credentials are used for the single
        request only and are never stored, logged, traced, or cached.
      parameters:
        - name: url
          in: query
          required: true
          description: A LinkedIn profile URL of the form https://www.linkedin.com/in/{identifier}
          schema:
            type: string
          example: https://www.linkedin.com/in/williamhgates
        - name: X-LinkedIn-Li-At
          in: header
          required: false
          description: >
            Optional caller-supplied LinkedIn li_at cookie. Must be sent together with
            X-LinkedIn-JSESSIONID; supplying only one is a 400. Prefer loading it from
            an environment variable rather than typing it into shell history.
          schema:
            type: string
        - name: X-LinkedIn-JSESSIONID
          in: header
          required: false
          description: >
            Optional caller-supplied LinkedIn JSESSIONID cookie. Must be sent together
            with X-LinkedIn-Li-At.
          schema:
            type: string
        - name: X-LinkedIn-User-Agent
          in: header
          required: false
          description: >
            Optional browser User-Agent for a caller-supplied session, so the request
            matches the browser that created the cookies. Ignored without caller cookies.
          schema:
            type: string
      security:
        - apiKey: []
      responses:
        "200":
          description: The normalized profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResult"
        "400":
          description: The request was malformed or the URL was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >
            A valid API key was required and not provided, or a caller-supplied
            LinkedIn session was rejected by LinkedIn or is already known to be
            expired (caller_session_invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The profile could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The public rate limit or the upstream rate limit was exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream authentication failed or the response could not be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: LinkedIn was temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: The upstream request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: The service is ready to serve traffic.
        "503":
          description: The service is not ready.

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    ProfileResult:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    Meta:
      type: object
      properties:
        retrieved_at:
          type: string
          format: date-time
        schema_version:
          type: string
          example: "2.0"
        source:
          type: string
          example: linkedin
        cached:
          type: boolean
      required: [retrieved_at, schema_version, source, cached]

    Profile:
      type: object
      properties:
        public_identifier: { type: string }
        profile_url: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        headline: { type: string }
        summary: { type: string }
        location:
          $ref: "#/components/schemas/Location"
        profile_picture:
          $ref: "#/components/schemas/Image"
        background_image:
          $ref: "#/components/schemas/Image"
        websites:
          type: array
          items:
            $ref: "#/components/schemas/Website"
        verified: { type: boolean }
        influencer: { type: boolean }
        premium: { type: boolean }
      required: [public_identifier, profile_url]

    Location:
      type: object
      properties:
        country_code: { type: string }
        text: { type: string }

    Image:
      type: object
      properties:
        url: { type: string }
      required: [url]

    Website:
      type: object
      properties:
        url: { type: string }
        category: { type: string }
      required: [url]

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - caller_session_invalid
                - profile_not_found
                - rate_limited
                - upstream_auth_failed
                - upstream_rate_limited
                - upstream_timeout
                - upstream_unavailable
                - upstream_parse_error
                - internal_error
            message:
              type: string
            request_id:
              type: string
          required: [code, message]
      required: [error]
